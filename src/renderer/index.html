<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- WAJIB untuk iOS: tanpa ini WKWebView merender halaman selebar 980px
         lalu memperkecilnya. Android selama ini tertutupi konfigurasi WebView
         Capacitor sehingga tampak normal tanpa meta ini.
         viewport-fit=cover SENGAJA BELUM ditambahkan: ia mengaktifkan
         env(safe-area-inset-*), sementara variabel --safe-* di main.css belum
         dipakai elemen mana pun. Menambahkannya sekarang membuat konten boleh
         melebar ke area notch tanpa padding yang menahannya.
         user-scalable=no juga SENGAJA tidak dipakai: itu mematikan pinch-zoom
         gambar yang hari ini masih bisa dilakukan pengguna Android. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NNI Messenger</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: ws://localhost:* wss://localhost:* https://chat.bsilongevity.com:4443 wss://chat.bsilongevity.com:4443; media-src 'self' blob:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
